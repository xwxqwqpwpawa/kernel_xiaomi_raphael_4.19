name: CI

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/xwxqwqpwpawa/kernel_xiaomi_raphael_4.19
          kernel-branch: lineage-23.0_raphael
          config: raphael_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          ksu: false
          ksu-version: v3.0.0-30-legacy
          ksu-lkm: false
          ksu-other: true
          ksu-url: https://github.com/rsuntk/KernelSU/
          lxc: false
          anykernel3: true
